<svg xmlns="http://www.w3.org/2000/svg" color="#0d0d0d" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <mask id="dome-cutout">
      <rect width="100" height="100" fill="white" />
      <!-- Canopy-to-shade separation gap -->
      <rect x="24" y="23" width="52" height="3.5" fill="black" />
      <!-- Inner rim cutout showing the hollow underside -->
      <ellipse cx="50" cy="80" rx="31" ry="4.5" fill="black" />
    </mask>
  </defs>

  <g mask="url(#dome-cutout)" fill="currentColor">
    <!-- Top Ceiling Canopy Collar -->
    <rect x="27" y="13" width="46" height="11" rx="2" />
    <!-- Rounded Bell/Dome Shade -->
    <path d="M 15 41 Q 15 25 32 25 L 68 25 Q 85 25 85 41 L 85 80 A 35 6 0 0 1 15 80 Z" />
  </g>
</svg>
